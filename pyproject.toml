[project]
name = "valtron-core"
version = "0.1.21"
description = "LLM call optimization across various providers (online and local models)"
authors = [{name = "InferLink", email = "valtron@inferlink.com"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core dependencies for LLM optimization
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    # LiteLLM - Universal LLM interface
    "litellm>=1.0.0,<2",
    # Configuration management
    "python-dotenv>=1.0.0,<2",
    # Logging
    "structlog>=24.0.0,<25",
    # CLI support
    "typer>=0.12,<0.26",
    "rich>=13.0.0,<14",
    "tqdm>=4.0,<5",
    # String similarity (used in core decompose and evaluation)
    "rapidfuzz>=3.14.3,<4",
    # Optimal one-to-one assignment for unordered-list alignment (Hungarian algorithm)
    "scipy>=1.13,<2",
    "requests>=2.31.0,<3",
    # Visualization and reporting
    "matplotlib>=3.8.0,<4",
    "jinja2>=3.1.0,<4",
    # Configuration wizard UI
    "flask>=3.0.0,<4",
    "flask-cors>=6.0.0,<7",
    "nltk>=3.9.2,<4",
    "reportlab==4.4.10",
    "jsonschema>=4.26.0,<5",
]

[project.optional-dependencies]
# Optional: transformer model training/inference (pip install valtron-core[transformers])
transformers = [
    "torch>=2.4.0,<3",
    # NOTE: known CVEs at 4.57.6 (see GHSA-69w3-r845-3855, GHSA-29pf-2h5f-8g72,
    # GHSA-fgcw-684q-jj6r); the fix requires transformers>=5, but 5.x drops
    # support for loading tokenizers that ship only a legacy `vocab.txt` with
    # no `tokenizer.json` (e.g. prajjwal1/bert-tiny, used in tests), which
    # breaks bert_trainer.py/transformer_classifier.py as written. Left
    # pinned below 5 until that tokenizer-loading path is updated.
    "transformers>=4.35.0,<5",
    "scikit-learn>=1.3.0,<2",
    "datasets>=2.18.0",
    "accelerate>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/inferlinkdev/valtron-core/"
Documentation = "https://valtron.ai/docs/"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0.0,<2",
    "pytest-cov>=4.1.0,<5",
    # NOTE: known CVEs at 24.10.0 (see GHSA-v53h-f6m7-xcgm and others,
    # arbitrary file write via unsanitized cache filename); the fix
    # requires black>=26.3.1, but that reformats ~40 files repo-wide, which
    # would conflict with other pending PR changes right now. Left pinned
    # until those land.
    "black>=24.0.0,<25",
    "ruff>=0.3.0,<0.4",
    "mypy>=1.9.0,<3",
    "ipython>=8.0.0,<9",
]

[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valtron_core"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# extend-select (not select) so ruff's existing default checks (E4, E7, E9, F)
# keep running unchanged; this only adds complexity/size gates on top of them.
# See ARCHITECTURE_PROPOSAL.md's "Code quality gates" section: C901 is
# cyclomatic complexity; PLR0911/PLR0912/PLR0915 (returns/branches/statements)
# are the closest practical proxy this toolchain has for cognitive complexity,
# since there is no dedicated rule for it here. PLR0913 (too-many-arguments)
# was tried and dropped: at its default threshold of 5 it flagged ~40 functions
# across unrelated modules (training/, scoring/comparisons.py, model_catalog.py,
# etc.) with no real complexity signal, just a long-established keyword-args
# style in this codebase; it is a parameter-list-shape concern, not a
# control-flow complexity one. Thresholds below are ruff's own defaults, not
# tightened.
extend-select = ["C901", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Files this migration does not touch and has no plan to: existing violations
# are suppressed at the file level here rather than per-function, since there
# is no new code landing in these files for the gate to protect against. Every
# file this plan DOES actively evolve (evaluation/model_eval.py,
# evaluation/referenced_eval.py, evaluator.py, runner.py, reports/_base.py,
# reports/generate_html_report.py, reports/generate_pdf_report.py,
# scoring/json_eval/evaluator.py, utilities/config_wizard.py) instead gets a
# targeted `# noqa` on each specific already-known-complex function, so a NEW
# complex function added to one of those files during this migration still
# gets caught.
"src/valtron_core/analysis/_report.py" = ["C901", "PLR0912", "PLR0915"]
"src/valtron_core/analysis/tradeoff_analyzer.py" = ["C901"]
"src/valtron_core/attachments.py" = ["C901", "PLR0912"]
"src/valtron_core/client.py" = ["C901", "PLR0912", "PLR0915"]
"src/valtron_core/few_shot_training_data_generator.py" = ["C901", "PLR0912", "PLR0915"]
"src/valtron_core/loader.py" = ["C901", "PLR0912", "PLR0915"]
"src/valtron_core/models.py" = ["C901"]
"src/valtron_core/schema_synthesis.py" = ["C901", "PLR0911"]
"src/valtron_core/utilities/cli_introspect.py" = ["C901", "PLR0912", "PLR0915"]
"src/valtron_core/utilities/code_introspection.py" = ["C901", "PLR0911", "PLR0912"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
data_file = "test-reports/.coverage"
source = ["src/valtron_core"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "test-reports/htmlcov"

[tool.coverage.xml]
output = "test-reports/coverage.xml"
