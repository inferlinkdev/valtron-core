name: Deploy Docs to SiteGround

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: docs/uv.lock

      - name: Build Docs
        working-directory: docs
        run: ./build.sh

      - name: Deploy to SiteGround via rsync
        if: github.ref == 'refs/heads/main'
        uses: easingthemes/ssh-deploy@ece05a22752e524363164bfb2f69a5ba4f8ded0d  # v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "docs/_build/html/"
          REMOTE_HOST: ${{ secrets.SG_SERVER_IP }}
          REMOTE_USER: ${{ secrets.SG_USERNAME }}
          REMOTE_PORT: "18765"
          TARGET: "/home/customer/www/valtron.ai/public_html/docs"

      - name: Flush SiteGround Dynamic Cache
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.SG_SERVER_IP }}
          username: ${{ secrets.SG_USERNAME }}
          key: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          port: 18765
          script: |
            site-tools-client domain update id=1 flush_cache=1
